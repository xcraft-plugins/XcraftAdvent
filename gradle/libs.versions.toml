[versions]
spigot = "26.3-R0.1-SNAPSHOT"
# Bundled with Minecraft. spigot-api declares commons-lang3 with <scope>provided</scope>,
# which is non-transitive, so Gradle cannot inherit its version from spigot-api and it
# has to be stated here and kept in sync with the spigot-api POM manually.
commons-lang3 = "3.20.0"
junit = "6.1.3"


[libraries]
spigot = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
# Version omitted on purpose: spigot-api pulls guava with compile scope, so the
# version (currently 33.6.0-jre) is inherited from spigot-api automatically.
google-guava = { module = "com.google.guava:guava" }
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

junit-platform = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }


[plugins]
versions-updater = "io.github.ben-manes.versions:0.65.0"
spigot-manadrop = "fr.il_totore.manadrop:0.4.3"
